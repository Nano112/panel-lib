name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build every Minecraft version (+ tests)
        run: ./gradlew :fabric:buildAllVersions --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: panel-lib-jars
          path: build/libs/**/*.jar

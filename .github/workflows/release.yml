name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build all versions
        run: ./gradlew :fabric:buildAllVersions --no-daemon
      - name: Verify release tag and packaged jars
        run: |
          VERSION=$(awk -F= '/^versionMajor=/{ma=$2} /^versionMinor=/{mi=$2} /^versionPatch=/{pa=$2} END{print ma"."mi"."pa}' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$VERSION"
          python3 scripts/verify-release.py
      - name: Publish Maven artifacts to GitHub Packages
        run: ./gradlew publish -x test --no-daemon
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage Maven artifacts for the public Pages repo
        run: ./gradlew publishAllPublicationsToStagingRepository -x test --no-daemon
      - name: Deploy Maven repo to GitHub Pages
        # keep_files preserves previously released versions - a maven repo is
        # cumulative, so this must never wipe the branch.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/maven-repo
          destination_dir: maven
          keep_files: true
      - name: GitHub Release with jars
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/**/*.jar
            build/libs/**/SHA256SUMS
          body_path: docs/release-0.1.3.md
